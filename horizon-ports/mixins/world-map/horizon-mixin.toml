[mod]
id = "world_map"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "c9d61dcab7a64e4aee9385414686f1bcd420e362"

# The map's memory, beside the minimap's scan in the library crate.
[[module]]
id = "store"
file = "crates/horizon-client/src/minimap.rs"
name = "world_map"
source = "store.rs"
visibility = "pub"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "world_map"
source = "runtime.rs"

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [{ name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" }]

[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "wheel.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "mods"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
