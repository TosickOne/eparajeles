[mod]
id = "camera_overhaul"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "c9d61dcab7a64e4aee9385414686f1bcd420e362"

[[module]]
id = "engine"
file = "crates/horizon-client/src/game.rs"
name = "camera_overhaul_engine"
source = "engine.rs"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "camera_overhaul"
source = "runtime.rs"

# The view bob pose, once a frame: the tilt multiplies into it.
[[injection]]
id = "bob"
kind = "RETURN"
target = "horizon_client::game::fov::Game<'_>::bob_matrix"
helper = "bob.rs"
bindings = [
  { name = "value", ty = "glam::Mat4", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[[injection]]
id = "mods"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
