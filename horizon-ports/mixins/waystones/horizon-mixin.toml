[mod]
id = "waystones"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "c9d61dcab7a64e4aee9385414686f1bcd420e362"

[[module]]
id = "engine"
file = "crates/horizon-client/src/game.rs"
name = "waystones_engine"
source = "engine.rs"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "waystones"
source = "runtime.rs"

[[injection]]
id = "use_block"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::Game<'_>::use_hand"
helper = "use.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "hit", ty = "Option<&crate::game::Hit>", value = "block_hit" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "mods"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]
